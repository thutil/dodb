packages:
  - 'ui'

allowBuilds:
  sharp: true
  unrs-resolver: true
  better-sqlite3: false
  electron-winstaller: false

minimumReleaseAgeExclude:
  - lucide-react@1.33.0

# These are held back by their parent package, so a lockfile update alone cannot
# reach the patched release. monaco-editor pins dompurify exactly.
overrides:
  dompurify: ^3.4.17
  brace-expansion@>=4.0.0 <6.0.0: ^5.0.12
  # typescript-eslint asks for minimatch 10, whose fix only exists in 11.
  minimatch@>=7.0.0 <11.0.1: ^11.0.4
  # @next/eslint-plugin-next only calls globSync(), which tinyglobby also exports.
  # Dropping fast-glob removes micromatch and braces from the tree.
  '@next/eslint-plugin-next>fast-glob': npm:tinyglobby@^0.2.17

# Monaco vendors its own DOMPurify (3.4.15 in this release), which the override above
# cannot reach, so this swaps in 3.4.17. Drop it once a Monaco release ships >=3.4.17.
patchedDependencies:
  monaco-editor@0.57.0: patches/monaco-editor@0.57.0.patch
