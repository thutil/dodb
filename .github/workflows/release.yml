name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (without the v), e.g. 0.3.0'
        required: true

env:
  GO_VERSION: '1.27'
  NODE_VERSION: '20'
  PNPM_VERSION: '9'

jobs:
  macos:
    name: macOS (universal .dmg)
    runs-on: macos-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - run: pnpm install --no-frozen-lockfile

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          RAW="${{ inputs.version || github.ref_name }}"
          VERSION="${RAW#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          node scripts/sync-version.js "$VERSION"

      # This block is unchanged from the Tauri era on purpose: it is plain
      # security(1) and codesign plumbing with nothing framework-specific in it.
      # All it does is put an identity in the keychain and export the variables
      # scripts/build-macos.sh reads.
      #
      # Signing stays off until APPLE_CERTIFICATE exists, and the Apple variables
      # are only exported when they do -- an empty APPLE_SIGNING_IDENTITY would
      # make codesign try to sign with no identity. See docs/SIGNING.md.
      - name: Set up code signing
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          IDENTITY_OVERRIDE: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          if [ -z "${APPLE_CERTIFICATE:-}" ]; then
            echo "::warning::APPLE_CERTIFICATE is not set - releasing an ad-hoc signed build. Gatekeeper will warn on first launch and every user must clear quarantine by hand. See docs/SIGNING.md."
            exit 0
          fi

          KEYCHAIN_PASSWORD="${KEYCHAIN_PASSWORD:-$(uuidgen)}"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          # Suppresses the interactive prompt codesign would otherwise raise.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm -f certificate.p12

          if [ -n "${IDENTITY_OVERRIDE:-}" ]; then
            IDENTITY="$IDENTITY_OVERRIDE"
          else
            IDENTITIES=$(security find-identity -v -p codesigning build.keychain || true)
            # Prefer a Developer ID; fall back to whatever code signing identity
            # the certificate carries, so a self-signed one works too.
            IDENTITY=$(printf '%s' "$IDENTITIES" | awk -F'"' '/Developer ID Application/ {print $2; exit}')
            if [ -z "$IDENTITY" ]; then
              IDENTITY=$(printf '%s' "$IDENTITIES" | awk -F'"' 'NF > 1 {print $2; exit}')
            fi
          fi

          if [ -z "$IDENTITY" ]; then
            echo "::error::certificate imported but no code signing identity was found in it"
            exit 1
          fi
          echo "Signing as: $IDENTITY"
          echo "APPLE_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

          if [ -n "${APPLE_ID:-}" ] && [ -n "${APPLE_PASSWORD:-}" ] && [ -n "${APPLE_TEAM_ID:-}" ]; then
            {
              echo "APPLE_ID=$APPLE_ID"
              echo "APPLE_PASSWORD=$APPLE_PASSWORD"
              echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"
            } >> "$GITHUB_ENV"
            echo "Notarization credentials found - the DMG will be notarized and stapled."
          else
            echo "::warning::Signing without notarization (APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID incomplete). Gatekeeper still warns on first launch."
          fi

      - name: Build
        env:
          NEXT_PUBLIC_APP_VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/build-macos.sh "${{ steps.version.outputs.version }}"

      - name: Verify the artifact
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          DMG="dist/dodb_${VERSION}_universal.dmg"
          [ -f "$DMG" ] || { echo "::error::$DMG was not produced"; exit 1; }

          # The filename is a contract: Casks/dodb.rb and the cask job below both
          # hardcode dodb_<version>_universal.dmg.
          ARCHS=$(lipo -archs dist/dodb.app/Contents/MacOS/dodb)
          echo "architectures: $ARCHS"
          case "$ARCHS" in
            *x86_64*arm64*|*arm64*x86_64*) ;;
            *) echo "::warning::the DMG is named universal but the binary is only $ARCHS" ;;
          esac
          codesign --verify --verbose=1 dist/dodb.app
          # Captured first rather than piped into `grep -q`: that exits at the
          # first match, and the resulting EPIPE becomes the pipeline's status
          # under `pipefail`, inverting the test.
          SIGINFO=$(codesign -dvv dist/dodb.app 2>&1 || true)
          case "$SIGINFO" in
            *Signature=adhoc*)
              echo "::warning::this release is ad-hoc signed; users must clear quarantine by hand" ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: dodb-macos
          path: dist/dodb_*.dmg

  windows:
    name: Windows (.exe)
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - run: pnpm install --no-frozen-lockfile

      - name: Resolve version
        id: version
        shell: bash
        run: |
          RAW="${{ inputs.version || github.ref_name }}"
          echo "version=${RAW#v}" >> "$GITHUB_OUTPUT"

      - name: Build frontend
        shell: bash
        env:
          NEXT_PUBLIC_APP_VERSION: ${{ steps.version.outputs.version }}
        run: pnpm build:ui

      # CGO is required by the SQLite driver, and the Go toolchain on Windows
      # runners has no C compiler by default.
      - name: Set up MinGW
        uses: msys2/setup-msys2@v2
        with:
          install: mingw-w64-x86_64-gcc
          path-type: inherit

      - name: Build
        shell: bash
        env:
          CGO_ENABLED: '1'
        run: |
          set -euo pipefail
          # Checked before building: without cgo the SQLite driver still
          # registers itself and only fails on the first query, so a
          # misconfigured runner would ship a binary that looks fine and breaks
          # in the user's hands. internal/dbcore/cgo_required.go also fails the
          # compile, but naming the compiler here says why.
          gcc --version | head -1
          [ "$(go env CGO_ENABLED)" = "1" ] || { echo "::error::CGO is off; SQLite would ship as a stub"; exit 1; }

          mkdir -p dist
          go build -trimpath \
            -ldflags "-H windowsgui -X main.version=${{ steps.version.outputs.version }}" \
            -o "dist/dodb.exe" ./cmd/dodb
          ls -la dist/

      # A zip rather than an installer: the Tauri build produced .msi/.exe through
      # WiX and NSIS and neither has been ported. Shipping a zip is honest; a
      # half-working installer would not be.
      #
      # Compress-Archive rather than 7z: it is part of PowerShell itself, so this
      # does not depend on what the runner image happens to preinstall.
      - name: Package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ steps.version.outputs.version }}'
          $zip = "dist/dodb_${version}_windows_x64.zip"
          Compress-Archive -Path dist/dodb.exe -DestinationPath $zip -Force
          Get-ChildItem dist | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: dodb-windows
          path: dist/dodb_*_windows_x64.zip

  release:
    name: Publish release
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.version && format('v{0}', inputs.version) || github.ref_name }}
        run: |
          set -euo pipefail
          find artifacts -type f | sort
          FILES=$(find artifacts -type f \( -name '*.dmg' -o -name '*.zip' \))
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; updating assets with --clobber"
            gh release upload "$TAG" --clobber $FILES
          else
            echo "Creating release $TAG..."
            gh release create "$TAG" \
              --title "dodb $TAG" \
              --notes "dodb Database Manager for macOS (.dmg, universal) and Windows (.zip)." \
              $FILES
          fi

  homebrew:
    name: Update Homebrew cask
    needs: [macos, release]
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate and publish the cask
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN || secrets.GH_PAT }}
          VERSION: ${{ needs.macos.outputs.version }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          DMG_URL="https://github.com/thutil/dodb/releases/download/${TAG}/dodb_${VERSION}_universal.dmg"

          # The release asset is not immediately fetchable, so this polls rather
          # than failing on the first miss.
          SHA256=""
          for attempt in $(seq 1 15); do
            echo "attempt ${attempt}: fetching the DMG to checksum it"
            if curl --fail -sL "$DMG_URL" -o dodb.dmg; then
              SHA256=$(shasum -a 256 dodb.dmg | awk '{print $1}')
              break
            fi
            sleep 10
          done
          if [ -z "$SHA256" ]; then
            echo "::error::could not download $DMG_URL to compute its checksum"
            exit 1
          fi
          echo "sha256: $SHA256"

          mkdir -p Casks
          cat > Casks/dodb.rb <<EOF
          cask "dodb" do
            version "${VERSION}"
            sha256 "${SHA256}"

            url "https://github.com/thutil/dodb/releases/download/v#{version}/dodb_#{version}_universal.dmg"
            name "dodb"
            desc "Modern Multi-Platform Database Manager for Postgres, MySQL, MariaDB & SQLite"
            homepage "https://github.com/thutil/dodb"

            livecheck do
              url :url
              strategy :github_latest
            end

            # The app does not update itself yet, so brew must be allowed to
            # replace it. Flip to true only once the in-app updater ships:
            # claiming it now leaves \`brew upgrade --cask dodb\` users stale.
            auto_updates false
            depends_on macos: ">= :big_sur"

            app "dodb.app"

            zap trash: [
              # Saved connections and the master key that decrypts their
              # passwords. Omitting this left credentials on disk after uninstall.
              "~/.dodb",
              "~/Library/Application Support/com.thutil.dodb",
              "~/Library/Caches/com.thutil.dodb",
              "~/Library/Preferences/com.thutil.dodb.plist",
              "~/Library/Saved Application State/com.thutil.dodb.savedState",
              "~/Library/WebKit/com.thutil.dodb",
            ]
          end
          EOF

          echo "--- generated cask ---"
          cat Casks/dodb.rb
          brew style --cask Casks/dodb.rb || echo "::warning::brew style reported issues"

          gh release upload "$TAG" Casks/dodb.rb --clobber || true

          if [ -z "${TAP_TOKEN:-}" ]; then
            echo "HOMEBREW_TAP_TOKEN not configured; skipping the tap push"
            exit 0
          fi

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/thutil/homebrew-tap.git" tap_repo || \
            git clone "https://x-access-token:${TAP_TOKEN}@github.com/thutil/tap.git" tap_repo
          mkdir -p tap_repo/Casks
          cp Casks/dodb.rb tap_repo/Casks/dodb.rb
          cd tap_repo
          git add Casks/dodb.rb
          git commit -m "feat(cask): update dodb to v${VERSION}" || { echo "nothing to commit"; exit 0; }
          git push origin main || git push origin master
