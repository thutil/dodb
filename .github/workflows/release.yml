name: Release macOS DMG

on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'
  workflow_dispatch:

jobs:
  release:
    name: Build & Publish macOS DMG
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: |
          pnpm install --no-frozen-lockfile
          pnpm --prefix ui install --no-frozen-lockfile

      - name: Build Backend & Frontend
        run: pnpm build

      - name: Build macOS DMG Package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm dist:mac

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-dmg/*.dmg
            dist-dmg/*.blockmap
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ### ⚠️ macOS Installation & Gatekeeper Security Notice

            Since this build is ad-hoc packaged without an Apple Developer ID Code Signing Certificate, macOS Gatekeeper will block unsigned applications upon first launch.

            #### How to Install:
            1. Download and open `dodb-*.dmg`.
            2. Drag **`dodb.app`** to your `/Applications` folder.
            3. Open **Terminal** and run:
               ```bash
               xattr -dr com.apple.quarantine /Applications/dodb.app
               ```
            4. Launch **dodb** from Applications or via Spotlight (`Cmd + Space`).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
