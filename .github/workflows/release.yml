name: Release Multi-Platform Binaries

on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Sync package.json version with Git Tag
        shell: bash
        run: |
          TAG_VER="${GITHUB_REF_NAME#v}"
          echo "Setting package version to: $TAG_VER"
          npm version "$TAG_VER" --no-git-tag-version || true

      - name: Install dependencies
        run: |
          pnpm install --no-frozen-lockfile
          pnpm --prefix ui install --no-frozen-lockfile

      - name: Build Backend & Frontend
        run: pnpm build

      - name: Build macOS Artifacts
        if: matrix.os == 'macos-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm dist:mac

      - name: Build Linux Artifacts
        if: matrix.os == 'ubuntu-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm dist:linux

      - name: Upload Release Binaries
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-builds/*
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ### 🚀 dodb Database Manager Release

            Multi-platform database management tool supporting PostgreSQL, MariaDB/MySQL, and SQLite.

            #### ⚠️ macOS Security Note:
            If macOS Gatekeeper blocks launch upon initial install:
            ```bash
            xattr -dr com.apple.quarantine /Applications/dodb.app
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
