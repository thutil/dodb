name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: Test & typecheck
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: |
          pnpm install --no-frozen-lockfile
          pnpm --prefix ui install --no-frozen-lockfile

      # Runs tsc + next lint, and produces ui/out, which tauri-build expects.
      - name: Build frontend (typecheck + lint)
        run: pnpm build:ui

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
