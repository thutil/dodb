[package]
name = "app"
version = "0.2.4"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = { version = "1.0", features = ["raw_value", "preserve_order"] }
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "postgres", "mysql", "sqlite", "chrono", "uuid", "json", "bigdecimal", "rust_decimal"] }
tokio = { version = "1.53.1", features = ["full"] }
aes-gcm = "0.10.3"
rand = "0.9.5"
hex = "0.4.3"
futures = "0.3.34"
dirs = "6.0.0"
pbkdf2 = "0.12.2"
hkdf = "0.12.4"
sha2 = "0.10.9"
hmac = "0.12.1"
tauri-plugin-store = "2.4.4"
uuid = { version = "1.20.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = "1.36"
bigdecimal = "0.4"
rfd = "0.15"
csv = "1.3"
encoding_rs = "0.8"
encoding_rs_io = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "4", default-features = false, features = ["v1", "apple-native-keyring-store"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "4", default-features = false, features = ["v1", "windows-native-keyring-store"] }



# sqlx hardcodes `TimeZone=UTC` in the Postgres startup message, and a server whose
# time zone files cannot resolve that name rejects the connection outright. The fork
# adds `PgConnectOptions::timezone()` (branch cut from the v0.8.6 tag, one commit on
# top) so `connect_postgres_with_fallback` can fall back to `UTC0`.
# `sqlx-core` is patched too: the fork's sqlx-postgres depends on it by path, so
# without this the build would link two distinct copies of sqlx-core 0.8.6.
[patch.crates-io]
sqlx-core = { git = "https://github.com/bankjirapan/sqlx", branch = "dodb-timezone-0.8.6" }
sqlx-postgres = { git = "https://github.com/bankjirapan/sqlx", branch = "dodb-timezone-0.8.6" }
